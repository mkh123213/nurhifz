version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  corereusablepackage:
    path: ./corereusablepackage
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
